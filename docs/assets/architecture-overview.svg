<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">WIZ.AI Voice Book QA architecture</title>
  <desc id="desc">Voice and text input flow through conversation resolution, dense retrieval, reranking, grounded answer generation, citation validation, response display, and optional speech synthesis. PDF upload feeds a local embedded index. Clarification branches before retrieval.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#267FB7"/>
    </marker>
    <style>
      .title { fill: #182638; font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #607084; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.3px; }
      .label { fill: #182638; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .subtle { fill: #607084; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .principle { fill: #314155; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .box { fill: #FFFFFF; stroke: #267FB7; stroke-width: 1.5; rx: 6; }
      .soft { fill: #F7FAFC; }
      .connector { fill: none; stroke: #267FB7; stroke-width: 1.8; marker-end: url(#arrow); }
      .optional { stroke-dasharray: 6 5; }
      .clarify { fill: #FFF8F0; stroke: #E7822B; stroke-width: 1.5; rx: 6; }
      .clarify-line { fill: none; stroke: #E7822B; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1020" fill="#FFFFFF"/>

  <text x="40" y="46" class="title">WIZ.AI Voice Book QA</text>
  <line x1="40" y1="66" x2="1160" y2="66" stroke="#DCE4EC" stroke-width="1"/>

  <text x="40" y="104" class="section">QUESTION INPUT</text>
  <text x="40" y="244" class="section">DOCUMENT INDEXING</text>
  <text x="750" y="244" class="section">GROUNDED QA RUNTIME</text>

  <!-- Question input -->
  <path class="connector" d="M 170 153 H 208"/>
  <path class="connector" d="M 388 153 H 428"/>
  <path class="connector" d="M 628 153 H 748"/>

  <rect class="box soft" x="40" y="122" width="130" height="62"/>
  <text x="105" y="159" class="label">Voice</text>

  <rect class="box" x="210" y="122" width="178" height="62"/>
  <text x="299" y="159" class="label">Deepgram ASR</text>

  <rect class="box soft" x="430" y="122" width="198" height="62"/>
  <text x="529" y="159" class="label">Text + transcript</text>

  <rect class="box" x="750" y="122" width="220" height="62"/>
  <text x="860" y="149" class="label">Conversation</text>
  <text x="860" y="170" class="label">Resolver</text>

  <!-- Clarification exits before retrieval -->
  <path class="clarify-line" d="M 970 153 H 1018 V 185"/>
  <rect class="clarify" x="1000" y="187" width="168" height="62"/>
  <text x="1084" y="214" class="label">Clarification</text>
  <text x="1084" y="235" class="subtle">retrieval skipped</text>

  <!-- Document indexing -->
  <path class="connector" d="M 170 295 H 208"/>
  <path class="connector" d="M 328 295 H 358"/>
  <path class="connector" d="M 478 295 H 508"/>
  <path class="connector" d="M 710 295 H 748"/>

  <rect class="box soft" x="40" y="264" width="130" height="62"/>
  <text x="105" y="301" class="label">PDF Upload</text>

  <rect class="box" x="210" y="264" width="118" height="62"/>
  <text x="269" y="301" class="label">Parse</text>

  <rect class="box" x="360" y="264" width="118" height="62"/>
  <text x="419" y="301" class="label">Chunk</text>

  <rect class="box" x="510" y="256" width="200" height="78"/>
  <text x="610" y="287" class="label">Voyage Embedding</text>
  <text x="610" y="311" class="label">/ Local Index</text>

  <!-- Main grounded QA path -->
  <path class="connector" d="M 860 184 V 262"/>
  <rect class="box soft" x="750" y="264" width="220" height="62"/>
  <text x="860" y="301" class="label">Dense Retrieval Top 10</text>

  <path class="connector" d="M 860 326 V 374"/>
  <rect class="box" x="750" y="376" width="220" height="62"/>
  <text x="860" y="413" class="label">Voyage rerank-2.5</text>

  <path class="connector" d="M 860 438 V 486"/>
  <rect class="box soft" x="750" y="488" width="220" height="62"/>
  <text x="860" y="525" class="label">Top 5 Evidence</text>

  <path class="connector" d="M 860 550 V 598"/>
  <rect class="box" x="750" y="600" width="220" height="62"/>
  <text x="860" y="637" class="label">Grounded Qwen Answer</text>

  <path class="connector" d="M 860 662 V 710"/>
  <rect class="box soft" x="750" y="712" width="220" height="62"/>
  <text x="860" y="749" class="label">Citation Validation</text>

  <path class="connector" d="M 860 774 V 822"/>
  <rect class="box" x="750" y="824" width="220" height="62"/>
  <text x="860" y="861" class="label">Response UI</text>

  <!-- Optional playback branch -->
  <path class="connector optional" d="M 970 855 H 998"/>
  <rect class="box soft" x="1000" y="824" width="168" height="62"/>
  <text x="1084" y="850" class="subtle">optional</text>
  <text x="1084" y="872" class="label">Qwen TTS</text>

  <path class="connector optional" d="M 1084 886 V 922"/>
  <rect class="box" x="1000" y="924" width="168" height="62"/>
  <text x="1084" y="961" class="label">Browser Playback</text>

  <line x1="40" y1="988" x2="1160" y2="988" stroke="#DCE4EC" stroke-width="1"/>
  <text x="600" y="1012" class="principle">Conversation context resolves intent. The uploaded PDF remains the source of truth.</text>
</svg>
